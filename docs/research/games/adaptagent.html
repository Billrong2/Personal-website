(()=>{'use strict';
const $=id=>document.getElementById(id),L=(en,zh)=>window.BillI18n?.language==='zh'?zh:en;
const modules=[{id:'data',slot:'shape',name:['Data envelope','data 封装'],tag:'SHAPE',read:r=>r.data},{id:'payload',slot:'shape',name:['Payload envelope','payload 封装'],tag:'SHAPE',read:r=>r.payload},{id:'flat',slot:'shape',name:['Flat record','平面记录'],tag:'SHAPE',read:r=>r},{id:'number',slot:'count',name:['Numeric cast','数值转换'],tag:'TYPE',read:n=>Number(n)+1},{id:'raw',slot:'count',name:['Raw increment','原样递增'],tag:'TYPE',read:n=>n+1},{id:'one',slot:'count',name:['Reset to one','重置为一'],tag:'TYPE',read:n=>1},{id:'unknown',slot:'empty',name:['Fallback record','回退记录'],tag:'BOUNDARY',read:()=>({name:'unknown',next:0})},{id:'skip',slot:'empty',name:['Skip delivery','跳过空记录'],tag:'BOUNDARY',read:()=>null},{id:'unsafe',slot:'empty',name:['No guard','不设保护'],tag:'BOUNDARY',read:()=>undefined}];
const levels=[{name:['Nested Harbor','嵌套港口'],title:['Restore the harbor contract','修复港口数据契约'],copy:['The new client wraps records in data. Visit counts may arrive as strings. Missing responses must produce an unknown record.','新客户端把记录放在 data 中；访问次数可能是字符串。响应缺失时，必须输出 unknown 回退记录。'],shape:'data',guard:'unknown',who:'Ada',n:'7',code:'client.read(id) → { data: { name, visits } }\nvisits: string | number\nnull → { name: "unknown", next: 0 }\nnext = numeric visits + 1'},
{name:['Envelope Foundry','封装铸造厂'],title:['Build for a different interface','为不同接口重新装配'],copy:['This district uses payload. Both text and numeric counts are valid. A missing response means no delivery, represented by null.','这个城区使用 payload。字符串和数值次数都合法。响应缺失时不应派送，以 null 表示。'],shape:'payload',guard:'skip',who:'Lin',n:'4',code:'gateway.get(id) → { payload: { name, visits } }\nvisits: string | number\nnull → null\nnext = numeric visits + 1'},
{name:['Legacy Terminal','旧系统终端'],title:['Finish the last crossing','完成最后一次跨越'],copy:['The legacy service returns the record itself. Keep the name, increment the numeric count and retain the fallback record for empty input.','旧服务直接返回记录本身。保留名称、把次数作为数字加一，并为空响应保留回退记录。'],shape:'flat',guard:'unknown',who:'Mira',n:'11',code:'legacy.lookup(id) → { name, visits }\nvisits: string | number\nnull → { name: "unknown", next: 0 }\nnext = numeric visits + 1'}];
let level=0,installed={shape:null,count:null,empty:null},selected='data',results=[],status=['Choose a context module, then install it in its matching socket.','选择上下文模块，再将它安装进对应插槽。'],statusType='',won=false,finished=false,delivery=0,delivering=false,runStart=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)');let moving=!reduce.matches,t=0,last=0;const canvas=$('world'),ctx=canvas.getContext('2d');
const socketInfo=[{id:'shape',name:['01 / INTERFACE','01 / 接口'],x:265,y:295},{id:'count',name:['02 / TYPE','02 / 类型'],x:455,y:295},{id:'empty',name:['03 / BOUNDARY','03 / 边界'],x:645,y:295}];
function m(id){return modules.find(x=>x.id===id)}
function setStatus(en,zh,type=''){status=[en,zh];statusType=type;$('status').textContent=L(...status);$('status').className='status '+type}
function install(slot){if(delivering||finished)return;const mod=m(selected);if(!mod||mod.slot!==slot){setStatus('This module belongs in a different socket. Match SHAPE, TYPE or BOUNDARY.','这个模块属于其他插槽。请匹配 SHAPE、TYPE 或 BOUNDARY。','error');return}installed[slot]=selected;won=false;results=[];delivery=0;setStatus('Module installed. Assemble all three sockets, then run verification.','模块已安装。组装三个插槽，然后运行验证。');render();draw()}
function response(l,n){const rec={name:l.who,visits:n};return l.shape==='flat'?rec:{[l.shape]:rec}}
function adapt(r){if(r===null&&installed.empty!=='unsafe')return m(installed.empty).read();const rec=m(installed.shape).read(r);return{name:rec.name,next:m(installed.count).read(rec.visits)}}
function verify(){if(delivering||finished)return;if(Object.values(installed).some(x=>!x)){setStatus('The courier needs all three context sockets before departure.','派送前，需要填满三个上下文插槽。','error');return}const l=levels[level],tests=[{name:['Text count','字符串次数'],input:response(l,l.n),expected:{name:l.who,next:Number(l.n)+1}},{name:['Numeric count','数值次数'],input:response(l,2),expected:{name:l.who,next:3}},{name:['Missing response','响应缺失'],input:null,expected:l.guard==='skip'?null:{name:'unknown',next:0}}];results=tests.map(test=>{let actual;try{actual=adapt(test.input)}catch{actual={error:'contract mismatch'}}return{...test,actual,ok:JSON.stringify(actual)===JSON.stringify(test.expected)}});won=results.every(x=>x.ok);delivery=0;if(won){delivering=true;runStart=performance.now();setStatus('Verifier passed. The bridge is powered; your patch is crossing.','验证通过。桥梁已通电，补丁正在送往对岸。','success');if(!moving)completeDelivery()}else setStatus('Delivery blocked. Inspect the failed contract below and swap a module.','派送被阻止。检查下方失败契约，替换对应模块。','error');render();draw()}
function completeDelivery(){delivery=1;delivering=false;if(level===levels.length-1){finished=true;setStatus('Three districts connected. The same intention now respects three different contracts.','三个城区已连通。同一目标现在遵守三种不同的数据契约。','success')}else setStatus('Patch delivered. The next district has a different contract.','补丁已送达。下一城区将使用不同契约。','success');render()}
function reset(all=false){if(all)level=0;installed={shape:null,count:null,empty:null};selected='data';results=[];won=false;finished=false;delivery=0;delivering=false;setStatus('Choose a context module, then install it in its matching socket.','选择上下文模块，再将它安装进对应插槽。');render();draw()}
function render(){const l=levels[level];document.title=L('AdaptAgent · Contract Courier','AdaptAgent · 契约信使');$('eyebrow').textContent=L('ADAPTAGENT / A PLAYABLE PAPER WORLD','ADAPTAGENT / 可探索的论文游戏世界');$('stage').setAttribute('aria-label',L('Patch delivery factory','补丁派送工厂'));$('track').setAttribute('aria-label',L('District progress','城区进度'));$('back').textContent=L('← RESEARCH ARCADE','← 科研游戏厅');$('research-link').textContent=L('Research home','科研首页');$('heading').textContent=L('CONTRACT COURIER','契约信使');$('lede').textContent=L('A patch is waiting to cross the city. Build its context, verify its behavior, then power the delivery bridge.','一份补丁正等待穿越城市。补全上下文、验证行为，再为派送桥梁通电。');$('level-badge').textContent=L('DISTRICT ','城区 ')+(level+1)+' / 3';$('district').textContent=L(...l.name).toUpperCase();$('bridge-status').textContent=won?L('BRIDGE ONLINE','桥梁已上线'):L('BRIDGE OFFLINE','桥梁未通电');$('instructions').textContent=L('Select or drag a module → install in a socket → verify. Keys 1–3 install the selected module; Enter verifies.','选择或拖动模块 → 放入插槽 → 验证。按 1–3 将所选模块安装到插槽；Enter 验证。');$('launch').textContent=delivering?L('Delivering…','派送中…'):L('Verify & launch →','验证并派送 →');$('launch').disabled=delivering||finished;$('reset').textContent=finished?L('Play again','重新开始'):L('Reset district','重置城区');$('motion').textContent=moving?L('Motion on','动态开启'):L('Motion off','动态关闭');$('motion').setAttribute('aria-pressed',String(moving));$('contract-label').textContent=L('READ THE DESTINATION CONTRACT','阅读目标城区契约');$('mission-title').textContent=L(...l.title);$('mission-copy').textContent=L(...l.copy);$('contract').textContent=l.code;$('module-label').textContent=L('CONTEXT MODULES / PICK ONE','上下文模块 / 选择一个');$('status').textContent=L(...status);$('status').className='status '+statusType;$('track').innerHTML=levels.map((x,i)=>'<i class="'+(i<level||i===level&&delivery===1?'done':'')+'"></i>').join('');$('bank').replaceChildren(...modules.map(mod=>{const b=document.createElement('button');b.className='module';b.draggable=true;b.setAttribute('aria-pressed',String(selected===mod.id));const sm=document.createElement('small');sm.textContent=L(mod.tag,{SHAPE:'结构',TYPE:'类型',BOUNDARY:'边界'}[mod.tag]);const txt=document.createElement('span');txt.textContent=L(...mod.name);b.append(sm,txt);b.onclick=()=>{selected=mod.id;render()};b.ondragstart=e=>{selected=mod.id;e.dataTransfer.setData('text/plain',mod.id)};return b}));$('sockets').replaceChildren(...socketInfo.map(s=>{const b=document.createElement('button');b.className='socket '+(installed[s.id]?'active':'');const a=document.createElement('small');a.textContent=L(...s.name);const v=document.createElement('strong');v.textContent=installed[s.id]?L(...m(installed[s.id]).name):L('+ Install module','+ 安装模块');b.append(a,v);b.onclick=()=>install(s.id);b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(m(id))selected=id;install(s.id)};b.disabled=delivering||finished;return b}));$('results').replaceChildren(...results.map(r=>{const d=document.createElement('div');d.className='result '+(r.ok?'good':'bad');d.textContent=(r.ok?L('PASS / ','通过 / '):L('FAIL / ','失败 / '))+L(...r.name);const c=document.createElement('code');c.textContent=L('Expected ','期望 ')+JSON.stringify(r.expected)+' → '+L('received ','收到 ')+JSON.stringify(r.actual);d.append(c);return d}));$('next').hidden=delivery!==1||finished;$('next').textContent=L('Enter the next district →','前往下一城区 →');$('win').hidden=!finished;$('win').replaceChildren();if(finished){const h=document.createElement('h3');h.textContent=L('THE CITY IS CONNECTED.','整座城市已连通。');const p=document.createElement('p');p.textContent=L('You changed context and checked behavior, instead of assuming a renamed call would work everywhere. That is the adaptation question behind this world.','你改变上下文并检验行为，而不是假设替换函数名就能适用于所有仓库。这就是这个世界背后的代码适配问题。');$('win').append(h,p)}$('boundary').textContent=L('A game inspired by AdaptAgent’s context-guided adaptation and verification loop. The factory uses authored JavaScript fixtures, not live agents or a compiler. Passing these three checks is evidence only for these examples, not a guarantee for arbitrary code.','本游戏借鉴 AdaptAgent 的上下文引导适配与验证循环。工厂使用手写 JavaScript 测试例，不运行真实智能体或编译器。三个检查通过仅说明这些例子正确，不保证任意代码都可靠。');canvas.setAttribute('aria-label',L('Interactive factory. Select a context module, then click one of three illuminated sockets.','交互工厂。选择上下文模块，再点击三个发光插槽之一。'))}
