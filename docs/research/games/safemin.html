function remove(i){if(!active.has(i)||core||finished)return;const remaining=[...active].filter(j=>j!==i),sat=satisfying(remaining),label=levels[level].clauses[i].label;if(sat.length){rejected++;witness={...sat[0],satisfies:remaining};flash=i;flashUntil=performance.now()+850;say('Removal rejected: the projected assignment satisfies every remaining block. The original block stays.','删除被拒绝：投影中的赋值满足所有剩余方块。原方块已保留。','bad');log.unshift({ok:false,label});}else{const b=blocks.find(x=>x.id===i);if(b&&motion)for(let k=0;k<15;k++)particles.push({x:b.x,y:b.y-30,vx:(Math.random()-.5)*130,vy:-Math.random()*130,life:1.2});active.delete(i);safe++;witness=null;highlight=-1;log.unshift({ok:true,label});core=checkCore();if(core){say('Core secured. Every remaining block is necessary: removing any one makes the constraints satisfiable.','核心已锁定。每个剩余方块都不可缺少：再删除任意一条，约束都会变得可满足。','good');if(level===levels.length-1)finished=true}else say('Safe deletion accepted. No assignment satisfies the remaining conjunction; the beacon stays lit.','安全删除已接受。没有赋值满足剩余合取，信标继续亮着。','good')}render();draw()}

function render(){const l=levels[level];document.title=L('SAFEMIN · The Contradiction Citadel','SAFEMIN · 矛盾堡垒');$('eyebrow').textContent=L('SAFEMIN / A PLAYABLE PAPER WORLD','SAFEMIN / 可探索的论文游戏世界');$('log').setAttribute('aria-label',L('Removal log','删除记录'));$('back').textContent=L('← RESEARCH ARCADE','← 科研游戏厅');$('research-link').textContent=L('Research home','科研首页');$('heading').textContent=L('THE CONTRADICTION CITADEL','矛盾堡垒');$('lede').textContent=L('The fortress is made of constraints. Take it apart without extinguishing the contradiction that powers its core.','这座堡垒由约束组成。拆解它，同时守住为核心供能的矛盾。');$('level').textContent=L('FORTRESS ','堡垒 ')+(level+1)+' / 4';$('district').textContent=L(...l.name).toUpperCase();$('core-state').textContent=core?L('IRREDUCIBLE CORE SECURED','不可约核心已锁定'):'UNSAT / '+L('BEACON ACTIVE','信标开启');$('help').textContent=L('Click a tower block or its matching clause below. Keys 1–6 remove blocks. H reveals one safe candidate.','点击塔身方块或下方对应约束。按 1–6 删除方块；H 显示一个安全候选。');$('hint').textContent=L('Scan for a safe block','扫描安全方块');$('hint').disabled=core;$('reset').textContent=finished?L('Play all fortresses again','重新探索全部堡垒'):L('Rebuild fortress','重建堡垒');$('motion').textContent=motion?L('Motion on','动态开启'):L('Motion off','动态关闭');$('motion').setAttribute('aria-pressed',String(motion));$('mission-label').textContent=L('DISMANTLE / VERIFY / PRESERVE','拆解 / 验证 / 保留');$('title').textContent=L(...l.name);$('about').textContent=L(...l.about);$('remaining').textContent=active.size;$('safe').textContent=safe;$('rejected').textContent=rejected;$('remaining-label').textContent=L('BLOCKS REMAIN','剩余方块');$('safe-label').textContent=L('SAFE REMOVALS','安全删除');$('rejected-label').textContent=L('COUNTEREXAMPLES','反例');$('clauses').replaceChildren(...l.clauses.map((c,i)=>{const b=document.createElement('button');b.className='clause '+(active.has(i)?'':'removed');b.disabled=!active.has(i)||core;b.setAttribute('aria-label',L('Remove block ','删除方块 ')+(i+1)+': '+c.label);const n=document.createElement('span');n.className='number';n.textContent='C'+(i+1);const text=document.createElement('span');text.textContent=c.label;const r=document.createElement('span');r.className='remove';r.textContent=active.has(i)?'−':'✓';b.append(n,text,r);b.onclick=()=>remove(i);return b}));$('status').textContent=L(...status);$('status').className='status '+kind;$('witness').hidden=!witness;$('witness').replaceChildren();if(witness){const title=document.createElement('strong');title.textContent=L('COUNTEREXAMPLE / REMOVAL WOULD ALLOW','反例 / 删除后将允许');const pre=document.createElement('pre');pre.textContent='x = '+JSON.stringify(witness.x)+'\ny = '+JSON.stringify(witness.y)+'\n'+L('All remaining clauses are true.','所有剩余约束均为真。');$('witness').append(title,pre)}$('next').hidden=!core||finished;$('next').textContent=L('Enter the next fortress →','进入下一座堡垒 →');$('complete').hidden=!finished;$('complete').replaceChildren();if(finished){const h=document.createElement('h3');h.textContent=L('SMALLER. STILL IMPOSSIBLE.','更小，依然不可能。');const p=document.createElement('p');p.textContent=L('You extracted four irreducible cores. Minimal means no individual block can be removed; it does not claim globally fewest blocks.','你已提取四个不可约核心。“极小”意味着无法再单独删去任何方块，不代表全局方块数量最少。');$('complete').append(h,p)}$('log').replaceChildren(...log.slice(0,8).map(x=>{const li=document.createElement('li');li.textContent=(x.ok?L('ACCEPT / ','接受 / '):L('REJECT / ','拒绝 / '))+x.label;return li}));$('domain').textContent=L('Fixed domain: x, y ∈ {ε, a, b, aa, ab, ba, bb}; ε is the empty string. Every decision checks all 49 assignments.','固定域：x、y ∈ {ε, a, b, aa, ab, ba, bb}；ε 是空字符串。每次决定都检查全部 49 个赋值。');$('boundary').textContent=L('Inspired by SAFEMIN: propose deletions, then verify that UNSAT is preserved. This game uses actual exhaustive checking over a small finite string domain, not an LLM or a full SMT solver. Its cores and counterexamples apply only to the stated domain; they are not paper benchmark results.',
