</style></head><body><header><a href="../index.html" id="back">← RESEARCH ARCADE</a><nav><a href="../../worlds/research.html" id="research">Research home</a><a href="lamda.html">LλMDA ↗</a></nav></header><main><span class="kicker">PREDEX / A PREDICTIVE-EXECUTION RAILWAY</span><h1 id="title"></h1><p class="lede" id="lede"></p><div class="layout"><section class="world"><div class="railhead"><span id="district"></span><span id="processed"></span></div><canvas id="rail" width="1000" height="650" tabindex="0" aria-label="Interactive railway with a branch switch and variable-carrying train"></canvas><div class="hintbar" id="hintbar"></div></section><aside><div><span class="kicker" id="operator"></span><h2 id="next-label"></h2><div class="value" id="next-value"></div><div class="condition" id="condition" translate="no"></div><div class="turnout"><button id="upper" aria-pressed="true"></button><button id="lower" aria-pressed="false"></button></div><button class="primary dispatch" id="dispatch"></button><div class="actions"><button id="rewind"></button><button id="reset"></button><button id="motion" aria-pressed="false"></button></div></div><div><span class="kicker" id="cargo-label"></span><div class="cargo"><div><span id="var-label"></span><b id="var-value"></b></div><div><span id="count-label"></span><b id="count-value"></b></div></div><div id="status" class="status" role="status"></div><p class="controls" id="controls"></p></div></aside></div><section id="complete" class="complete" hidden><h2 id="complete-title"></h2><p id="complete-body"></p><button id="next" class="primary"></button></section><div class="bottom"><section class="tape"><span class="kicker" id="queue-label"></span><div class="queue" id="queue"></div><h3 id="history-label"></h3><div class="timeline" id="timeline"></div><p class="controls" id="history-help"></p><pre id="program" translate="no"></pre></section><section class="method"><span class="kicker" id="method-title"></span><p id="method"></p><p id="boun {name:['The Positive Line','正数专线'],values:[2,-1,4,-3,5],variable:'total',initial:0,predicate:v=>v>0,condition:'value > 0',operation:'total += value',apply:(a,v)=>a+v,expected:11,code:'values = [2, -1, 4, -3, 5]\ntotal = 0\nfor value in values:\n    if value > 0:\n        total += value\nprint(total)'},

{name:['The Moving Horizon','移动的地平线'],values:[2,7,3,9,6],variable:'best',initial:0,predicate:(v,a)=>v>a,condition:'value > best',operation:'best = value',apply:(_,v)=>v,expected:9,code:'values = [2, 7, 3, 9, 6]\nbest = 0\nfor value in values:\n    if value > best:\n        best = value\nprint(best)'}];
let level=0,index=0,value=0,updates=0,upper=true,history=[],transit=null,time=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,complete=false,bad=false,flash=0,message=['Set the turnout before dispatching the next data carriage.','在发出下一辆数据车厢之前，先设置道岔。'];const S=()=>stages[level];function state(){return{index,value,updates}}function reset(){index=0;value=S().initial;updates=0;upper=true;history=[state()];transit=null;complete=false;bad=false;flash=0;message=['Set the turnout before dispatching the next data carriage.','在发出下一辆数据车厢之前，先设置道岔。'];render();draw()}
function choose(v){if(transit||complete)return;upper=v;bad=false;flash=0;message=upper?['Turnout points to the update station. Check the predicate against the current cargo.','道岔指向更新站。请用当前车载状态检查谓词。']:['Turnout points to the bypass. The variable will keep its current value.','道岔指向旁路。变量会保留当前值。'];render();draw()}
function dispatch(){if(transit||complete)return;const input=S().values[index],truth=S().predicate(input,value);bad=false;if(upper!==truth){flash=1;bad=true;message=['Safety brake: '+input+' makes '+S().condition+' '+(truth?'true':'false')+'. Change the switch; cargo is unchanged.','安全制动：'+input+' 使 '+S().condition+' 为'+(truth?'真':'假')+'。切换道岔后重试；车载状态未改变。'];render();draw();return}transit={start:performance.now(),duration:1600,input,route:upper,old:value};message=['Carriage dispatched. Watch the selected line update the variable cargo.','车厢已发出。观察所选轨道如何更新车载变量。'];if(paused)arrive();else render()}
function arrive(){if(!transit)return;const trip=transit;if(trip.route){value=S().apply(value,trip.input);updates++}index++;history.push(state());transit=null;bad=false;message=trip.route?['Update committed: '+S().variable+' = '+value+'. The next predicate reads this new state.','更新已提交：'+S().variable+' = '+value+'。下一个谓词会读取这个新状态。']:['Bypass complete: '+S().variable+' stays '+value+'. A skipped update is also part of the trace.','旁路通过：'+S().variable+' 保持 '+value+'。跳过更新也是轨迹的一部分。'];if(index===S().values.length){complete=true;message=['All carriages delivered. stdout = '+value+'. You built the full trace, one decision at a time.','所有车厢已送达。stdout = '+value+'。你逐次作出决定，构建了完整执行轨迹。']}render();draw()}
function rewind(target){if(transit)return;target=Math.max(0,Math.min(target,history.length-1));const st=history[target];index=st.index;value=st.value;updates=st.updates;history=history.slice(0,target+1);complete=false;bad=false;flash=0;message=['Rewound to checkpoint '+target+'. Later steps were removed; replay from this exact state.','已回到检查点 '+target+'。后续步骤已移除；从这个精确状态重新执行。'];render();draw()}
function render(){const s=S();$('title').textContent=T('THE EXECUTION EXPRESS','执行特快');$('lede').textContent=T('Every input is a carriage. Every branch is a turnout. Route the train, carry the variables, and rewind time when you need to inspect a decision.','每个输入是一节车厢，每个分支是一组道岔。为列车选路、携带变量状态，需要检查决定时就倒转时间。');$('back').textContent=T('← RESEARCH ARCADE','← 科研游戏厅');$('research').textContent=T('Research home','科研主页');$('district').textContent='0'+(level+1)+' / 03 · '+T(...s.name);$('processed').textContent=index+' / '+s.values.length+' '+T('DELIVERED','已送达');$('hintbar').textContent=T('Click the central switch or use ↑ / ↓. Space dispatches. Backspace rewinds. Buttons provide the same touch controls.','点击中央道岔或按 ↑ / ↓ 切换。空格发车，退格回溯。下方按钮提供相同的触屏操作。');$('operator').textContent=T('YOU ARE THE BRANCH OPERATOR','你是分支调度员');$('next-label').textContent=complete?T('All inputs delivered','所有输入已送达'):T('Incoming value','待处理值');$('next-value').textContent=complete?'✓':s.values[index];$('condition').textContent='if '+s.condition;$('upper').textContent=T('↑ UPDATE','↑ 更新')+' · '+s.operation;$('lower').textContent=T('↓ BYPASS · keep state','↓ 旁路 · 保持状态');$('upper').classList.toggle('active',upper);$('lower').classList.toggle('active',!upper);$('upper').setAttribute('aria-pressed',String(upper));$('lower').setAttribute('aria-pressed',String(!upper));$('upper').disabled=$('lower').disabled=!!transit||complete;$('dispatch').textContent=transit?T('Carriage in transit…','车厢运行中…'):complete?T('Destination reached ✓','已抵达终点 ✓'):T('Dispatch carriage →','发出车厢 →');$('dispatch').disabled=!!transit||complete;$('rewind').textContent=T('Rewind one','回溯一步');$('rewind').disabled=!!transit||history.length<=1;$('reset').textContent=T('Restart line','重置线路');$('motion').textContent=paused?T('Motion off','动态关闭'):T('Pause motion','暂停动态');$('motion').setAttribute('aria-pressed',String(paused));$('cargo-label').textContent=T('LIVE VARIABLE CARGO','实时车载变量');$('var-label').textContent=s.variable.toUpperCase();$('var-value').textContent=value;$('count-label').textContent=T('UPDATES','更新次数');$('count-value').textContent=updates;$('status').textContent=T(...message);$('status').className='status'+(bad?' bad':'');$('controls').textContent=T('A wrong turnout triggers the safety brake before changing state. There is no guessing penalty. Watch “best” change in the final district.','错误道岔会在状态改变前触发安全制动，没有猜错惩罚。最后一个街区里要留意不断变化的 best。');$('queue-label').textContent=T('INPUT MANIFEST / LEFT TO RIGHT','输入清单 / 从左到右');$('queue').replaceChildren(...s.values.map((v,i)=>{const e=document.createElement('div');e.className='ticket'+(i===index?' active':i<index?' done':'');e.textContent=v;e.setAttribute('aria-label',T('Input '+(i+1)+': '+v+(i<index?', delivered':''),'输入 '+(i+1)+'：'+v+(i<index?'，已送达':'')));return e}));$('history-label').textContent=T('Rewind to a checkpoint','回到一个检查点');$('timeline').replaceChildren(...history.map((st,i)=>{const b=document.createElement('button');b.className=i===history.length-1?'active':'';b.textContent='T'+i+' · '+s.variable+'='+st.value;b.disabled=!!transit;b.onclick=()=>rewind(i);return b}));$('history-help').textContent=T('Selecting a checkpoint restores all variables and discards the later route. This is real state rewind, not just a visual scrubber.','选择检查点会恢复全部变量，并丢弃后续路线。这是真正的状态回溯，不只是移动一个可视化游标。');$('program').textContent=s.code;$('method-title').textContent=T('THE PAPER BEHIND THE RAILWAY','轨道背后的论文');$('method').textContent=T('PredEx combines program analysis with LLM prediction, using per-variable predictive backward slices when reasoning about uncertain execution. Here the predicate and input are fully known, so every rail decision and state update is computed exactly.','PredEx 将程序分析与 LLM 预测结合，在推理不确定执行时，利用逐变量的预测性反向切片提供上下文。这里的谓词与输入完全已知，所以每次轨道选择与状态更新都能精确计算。');$('boundary').textContent=T('Three original teaching programs; no LLM, Python interpreter, or paper benchmark runs here. The railway illustrates branches and variable traces, not the full PredEx system.','这里是三个原创教学程序，不运行 LLM、Python 解释器或论文基准。铁路展示分支与变量轨迹，而不是完整 PredEx 系统。');$('footer').textContent=T('Yi Li et al. · coauthored by Xiaokai Rong · Original interactive teaching game','Yi Li 等 · Xiaokai Rong 共同作者 · 原创交互教学游戏');$('complete').hidden=!complete;$('complete-title').textContent=T(level===2?'EVERY STATE HAS A HISTORY.':'NEXT STOP: UNDERSTANDING.',level===2?'每个状态，都有来路。':'下一站：理解。');$('complete-body').textContent=T('Output '+value+' reached the terminal after '+index+' branch decisions and '+updates+' updates. You can rewind to inspect the route, or continue to '+(level===2?'a new run.':'the next program.'),'输出 '+value+' 经由 '+index+' 次分支决定与 '+updates+' 次更新到达终点。你可以回溯检查路线，或'+(level===2?'重新开始。':'前往下一个程序。'));$('next').textContent=T(level===2?'Run the railway again':'Unlock next district →',level===2?'再次运行铁路':'解锁下一街区 →');document.title=T('PredEx · The Execution Express','PredEx · 执行特快');c.setAttribute('aria-label',T('Interactive data railway. Click the central turnout to switch the route; use the buttons for equivalent controls.','可交互数据铁路。点击中央道岔切换路线；也可用按钮完成相同操作。'))}
const start=[90,370],switchP=[310,370],up=[520,225],down=[520,500],merge=[760,370],end=[910,370];function track(points,active){g.lineJoin='round';g.lineCap='round';g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.strokeStyle='#0a1010';g.lineWidth=31;g.stroke();g.strokeStyle=active?'#3e7160':'#223d39';g.lineWidth=22;g.stroke();g.strokeStyle=active?'#a8e7c5':'#52766c';g.lineWidth=2;g.stroke();for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i],dx=b[0]-a[0],dy=b[1]-a[1],n=Math.hypot(dx,dy),px=-dy/n,py=dx/n;for(let d=10;d<n;d+=22){const x=a[0]+dx*d/n,y=a[1]+dy*d/n;g.strokeStyle='#9bc6ad66';g.lineWidth=2;g.beginPath();g.moveTo(x+px*12,y+py*12);g.lineTo(x-px*12,y-py*12);g.stroke()}}}
function station(x,y,label,color){g.fillStyle='#0006';g.fillRect(x-80,y+17,170,50);g.fillStyle='#14302d';g.fillRect(x-80,y-49,160,78);g.fillStyle='#245044';g.beginPath();g.moveTo(x-90,y-49);g.lineTo(x,y-76);g.lineTo(x+90,y-49);g.closePath();g.fill();g.strokeStyle=color;g.lineWidth=2;g.strokeRect(x-79,y-48,158,76);g.fillStyle=color;g.font='11px "JetBrains Mono",monospace';g.textAlign='center';g.fillText(label,x,y-13);g.fillStyle='#a3e2ca';for(let i=-1;i<=1;i++){g.fillRect(x+i*40-11,y+2,22,12)}}function train(x,y,input,carried){g.fillStyle='#0007';g.beginPath();g.ellipse(x,y+24,70,12,0,0,Math.PI*2);g.fill();g.fillStyle='#193f34';g.fillRect(x-62,y-13,124,35);g.fillStyle='#81c7a5';g.fillRect(x-59,y-30,118,27);g.fillStyle='#c0f7d8';g.fillRect(x+39,y-36,20,15);g.fillStyle='#143933';g.fillRect(x-52,y-23,38,17);g.fillRect(x+1,y-23,30,17);g.fillStyle='#edcf90';g.font='bold 13px "JetBrains Mono",monospace';g.textAlign='center';g.fillText(String(input),x-33,y-10);g.fillStyle='#e7fff0';g.font='10px "JetBrains Mono",monospace';g.fillText(S().variable+'='+carried,x+10,y+12);g.fillStyle='#0a1310';for(const dx of [-42,-17,19,44]){g.beginPath();g.arc(x+dx,y+24,7,0,Math.PI*2);g.fill();g.fillStyle='#5a8f75';g.fillRect(x+dx-2,y+22,4,4);g.fillStyle='#0a1310'}g.fillStyle='#f5d78d';g.fillRect(x+60,y-11,4,10);g.fillStyle='#f8df8a18';g.beginPath();g.moveTo(x+63,y-11);g.lineTo(x+100,y-27);g.lineTo(x+100,y+15);g.lineTo(x+63,y);g.closePath();g.fill()}
