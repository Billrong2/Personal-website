(()=>{'use strict';window.BillI18n?.register({strings:[['LλMDA / A PROGRAM-ANALYSIS ADVENTURE','LλMDA / 一场程序分析冒险']]});const $=s=>document.getElementById(s),c=$('world'),g=c.getContext('2d'),T=(en,zh)=>window.BillI18n?.language==='zh'?zh:en;const pos=[[170,280],[390,200],[625,255],[205,485],[490,455],[790,420]];const stages=[
{name:['The Price Archive','价格档案馆'],labels:['rows','row','price','total = 0','total += price','print(total)'],code:'01 rows = load_rows()    # missing function\n02 total = 0\n03 for row in rows:\n04     price = row["price"]\n05     total += price\n06 print(total)',slots:[{node:0,key:'loader',label:'load_rows() → List<Record>'},{node:2,key:'field',label:'Record.price → number'}],modules:[['loader','load_rows() → List<Record>'],['field','Record.price → number'],['wrong','Record.price → string']],edges:[[0,1],[1,2],[2,4],[3,4],[4,5]],route:[0,1,2,4,5],hint:['rows → row → price → total → print. Do not forget the initial total.','rows → row → price → total → print。别忘了 total 的初值。']},
{name:['The Signal Observatory','信号观测站'],labels:['samples','sample','amplitude','peak = 0','peak = max(...)','print(peak)'],code:'01 samples = read_signals()  # body missing\n02 peak = 0\n03 for sample in samples:\n04     amplitude = sample.amplitude\n05     peak = max(peak, amplitude)\n06 print(peak)',slots:[{node:0,key:'reader',label:'read_signals() → List<Signal>'},{node:2,key:'amplitude',label:'Signal.amplitude → number'}],modules:[['amplitude','Signal.amplitude → number'],['wrong','Signal.amplitude → List'],['reader','read_signals() → List<Signal>']],edges:[[0,1],[1,2],[2,4],[3,4],[4,5]],route:[0,1,2,4,5],hint:['The max operation needs a number. Wire amplitude and the initial peak into the update.','max 操作需要数值。把 amplitude 与 peak 初值都连接到更新节点。']},
{name:['The Last Checkpoint','最后的检查点'],labels:['entries','entry','is_valid','count = 0','count += 1','print(count)'],code:'01 entries = read_entries()  # missing body\n02 count = 0\n03 for entry in entries:\n04     if entry.is_valid:\n05         count += 1\n06 print(count)',slots:[{node:0,key:'entries',label:'read_entries() → List<Entry>'},{node:2,key:'flag',label:'Entry.is_valid → boolean'}],modules:[['wrong','Entry.is_valid → unknown'],['entries','read_entries() → List<Entry>'],['flag','Entry.is_valid → boolean']],edges:[[0,1],[1,2],[2,4],[3,4],[4,5]],route:[0,1,2,4,5],hint:['The predicate controls whether count changes. It is a control dependency, not a value added to count.','谓词决定 count 是否更新。这是控制依赖，不是把谓词的值加到 count 中。']}];
let level=0,phase='context',installed=new Set(),edges=new Set(),module=null,from=null,player=0,animation=null,projection=false,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,last=0,message=['Choose a context module, then place it on its amber socket.','选择一个上下文模块，再把它放到对应的琥珀色插槽。'],bad=false;const S=()=>stages[level],key=(a,b)=>a+'-'+b;function say(en,zh,error=false){message=[en,zh];bad=error;render()}function reset(){phase='context';installed=new Set();edges=new Set();module=null;from=null;player=0;animation=null;projection=false;message=['Choose a context module, then place it on its amber socket.','选择一个上下文模块，再把它放到对应的琥珀色插槽。'];bad=false;render();draw()}
function nodeAction(n){if(animation)return;if(phase==='context'){const slot=S().slots.find(x=>x.node===n);if(!slot){say('That platform is already known. Amber sockets mark missing context.','这个平台的信息已经明确。琥珀色插槽才表示缺失的上下文。');return}if(!module){say('Pick a module first; then touch this socket.','先选择模块，再点击这个插槽。');return}if(module!==slot.key){say('Type conflict. This module does not support the operation shown in the snippet.','类型冲突。这个模块不支持片段中出现的操作。',true);return}installed.add(slot.key);module=null;message=['Context fits the visible operation. It remains an explicit hypothesis.','上下文与可见操作一致。它仍是一个明确标记的假设。'];bad=false;if(installed.size===S().slots.length){phase='wire';message=['Context ready. Connect a definition to the line that reads or depends on it.','上下文已就绪。把定义连接到读取它或依赖它的语句。']}render();draw();return}if(phase==='wire'){if(from===null){from=n;message=['Now select the dependent platform.','现在选择依赖这个节点的平台。'];render();draw();return}const a=from;from=null;if(S().edges.some(([x,y])=>x===a&&y===n)){edges.add(key(a,n));message=['Bridge energized. The relation comes from the visible snippet.','桥梁已通电。这个关系来自可见的代码片段。'];bad=false;if(edges.size===S().edges.length){phase='walk';message=['All bridges are live. Walk the scout to the output portal.','所有桥梁已通电。带探索者走到输出传送门。']}}else{message=['No such direct dependency is shown. Inspect the code and try another wire.','代码中没有这个直接依赖。查看代码，再尝试另一条连线。'];bad=true}render();draw();return}if(phase==='walk'){if(n===player)return;if(!S().edges.some(([a,b])=>edges.has(key(a,b))&&((a===player&&b===n)||(a===n&&b===player)))){say('Move to a neighboring platform across a powered bridge.','沿着通电桥梁，移动到相邻平台。');return}move(n)}}
function move(n){if(paused){player=n;arrive()}else animation={from:player,to:n,start:performance.now(),duration:600};draw()}function arrive(){animation=null;if(player===5){phase='project';message=['You reached the output. Now project the analysis back to the original snippet.','你已抵达输出。现在把分析结果投影回原始片段。'];bad=false;render()}}
function action(){if(phase==='context'){say('Select a module card, then select its matching amber platform.','选择模块卡片，再选择对应的琥珀色平台。')}else if(phase==='wire'){const missing=S().edges.find(([a,b])=>!edges.has(key(a,b)));if(missing)say('Look for the direct relation: '+S().labels[missing[0]]+' → '+S().labels[missing[1]]+'。','寻找这个直接关系：'+S().labels[missing[0]]+' → '+S().labels[missing[1]]+'。')}else if(phase==='walk'){const queue=[[player]],seen=new Set([player]);while(queue.length){const path=queue.shift(),tail=path[path.length-1];if(tail===5){if(path.length>1)move(path[1]);break}for(const [a,b]of S().edges){const n=a===tail?b:b===tail?a:null;if(n!==null&&!seen.has(n)){seen.add(n);queue.push([...path,n])}}}}else if(phase==='project'){projection=true;phase='done';message=['Extra context fades away; the original dependency relations remain.','新增上下文逐渐隐去，原始片段中的依赖关系保留下来。'];render();draw()}}
function render(){const s=S();$('title').textContent=T('THE MISSING CITY','缺失之城');$('lede').textContent=T('Restore a broken program district. Place missing context, wire its dependencies, and cross the ruins one bridge at a time.','修复破碎的程序街区。补上缺失上下文、连接依赖，再沿桥梁穿越遗迹。');$('back').textContent=T('← RESEARCH ARCADE','← 科研游戏厅');$('research').textContent=T('Research home','科研主页');$('level-count').textContent=String(level+1).padStart(2,'0')+' / 03';$('district-name').textContent=T(...s.name);$('stage-name').textContent=T('CONTEXT RECONSTRUCTION / LIVE WORLD','上下文重建 / 交互世界');$('world-count').textContent=T('BRIDGES','桥梁')+' '+edges.size+' / '+s.edges.length;$('known-key').textContent=T('Known relation','已知关系');$('context-key').textContent=T('Added hypothesis','新增假设');$('walk-key').textContent=T('● Your scout','● 你的探索者');const index=['context','wire','walk','project','done'].indexOf(phase);document.querySelectorAll('.steps i').forEach((x,i)=>x.classList.toggle('on',i<=index));$('phase-kicker').textContent=T('MISSION','任务')+' / '+Math.min(index+1,4)+' / 4';const headings={context:['Restore the context','恢复上下文'],wire:['Build the dependency bridges','架起依赖桥梁'],walk:['Cross to the output','走向输出'],project:['Keep the original evidence','保留原始证据'],done:['District recovered','街区已修复']};$('objective').textContent=T(...headings[phase]);const instructions={context:['Select a module below. Click an amber socket in the world, or its node button. Modules are hypotheses, not recovered source.','选择下方模块，再点击世界里的琥珀色插槽或对应节点按钮。模块是假设，不是找回的源代码。'],wire:['Click a source platform, then its direct dependent. Each accepted wire becomes a physical bridge. Use the snippet below.','先点击来源平台，再点击直接依赖它的平台。正确连线会变成实体桥梁。下方代码可帮助判断。'],walk:['Click neighboring platforms or use the arrow keys. Reach print at the far end. “Follow current” walks one bridge.','点击相邻平台，或使用方向键。抵达远端的 print。“沿电流前进”会走过一座桥。'],project:['The amber reconstruction helped analysis. Fade it out to keep the original snippet’s dependency graph.','琥珀色的重建上下文帮助了分析。将它淡出，只保留原始片段中的依赖图。'],done:['The bridge network explains how the output depends on the visible program. Continue to another district.','桥梁网络展示了输出如何依赖可见程序。继续探索下一个街区。']};$('instruction').textContent=T(...instructions[phase]);$('inventory').hidden=phase!=='context';$('inventory').replaceChildren(...s.modules.map(([id,label])=>{const b=document.createElement('button');b.className='module'+(id===module?' selected':'')+(installed.has(id)?' used':'');b.textContent=(installed.has(id)?'✓ ':'◇ ')+label;b.disabled=installed.has(id);b.setAttribute('aria-pressed',String(id===module));b.onclick=()=>{module=id;render();draw()};return b}));$('node-title').textContent=T('PLATFORM CONTROLS / CLICK TO CONNECT OR WALK','平台控制 / 点击连接或移动');$('nodes').replaceChildren(...s.labels.map((label,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+label;b.className=from===i?'selected':'';b.onclick=()=>nodeAction(i);b.disabled=phase==='project'||phase==='done';return b}));$('action').textContent=T(...({context:['How to place','放置说明'],wire:['Reveal one route','显示一条线索'],walk:['Follow current →','沿电流前进 →'],project:['Project to original code','投影回原始代码'],done:['Projected ✓','投影完成 ✓']}[phase]));$('action').disabled=phase==='done';$('hint').textContent=T('Route hint','路线提示');$('reset').textContent=T('Restart district','重置街区');$('motion').textContent=paused?T('Motion off','动态关闭'):T('Pause motion','暂停动态');$('motion').setAttribute('aria-pressed',String(paused));$('controls').textContent=T('Touch/click modules and platforms. Arrow keys move the scout after wiring. Enter follows the current.','触摸或点击模块与平台。接线完成后用方向键移动；Enter 沿电流前进。');$('status').textContent=T(...message);$('status').className='status'+(bad?' bad':phase==='done'?' good':'');$('program').textContent=s.code;$('code-title').textContent=T('VISIBLE SNIPPET / YOUR ONLY EVIDENCE','可见代码片段 / 你的证据');$('method-title').textContent=T('WHY THIS IS LλMDA','这与 LλMDA 有什么关系');$('method').textContent=T('LλMDA reconstructs context for incomplete code with LLM and compiler feedback, applies traditional dependence analysis, then projects results to the original scope. Amber structures here represent assumptions; green bridges represent authored relations visible in this snippet.','LλMDA 结合 LLM 与编译器反馈，为不完整代码重建上下文，再进行传统依赖分析，并将结果投影回原始范围。这里的琥珀色结构表示假设，绿色桥梁表示这个片段中明确编写的关系。');$('boundary').textContent=T('This game uses three authored teaching examples and local rules. It is not Joern, a compiler, or a running LLM. The graph omits loop self-edges and other analysis detail for readability.','本游戏使用三个手写教学例子与本地规则，不运行 Joern、编译器或 LLM。为便于阅读，图中省略了循环自依赖等分析细节。');$('footer').textContent=T('Original interactive teaching game · Xiaokai (Bill) Rong','原创交互教学游戏 · Xiaokai (Bill) Rong');$('complete').hidden=phase!=='done';$('complete-title').textContent=T(level===2?'CITY RESTORED.':'A PATH THROUGH THE UNKNOWN.',level===2?'城市已修复。':'穿越未知的道路。');$('complete-body').textContent=T(level===2?'Three districts, three reconstructed contexts. Useful hypotheses helped you analyze the code; they never became facts about the missing source.':'The added context is hidden, while the original graph stays lit. That boundary is the point: reconstruction helps analysis without rewriting what was actually observed.',level===2?'三个街区，三组重建上下文。有用的假设帮助你分析代码，但并不会因此变成缺失源码的事实。':'新增上下文已隐藏，原始图依然亮着。这就是关键边界：重建帮助分析，但不改写实际观察到的证据。');$('next').textContent=T(level===2?'Play again':'Enter next district →',level===2?'重新游玩':'进入下个街区 →');document.title=T('LλMDA · The Missing City','LλMDA · 缺失之城');c.setAttribute('aria-label',T('Interactive isometric dependency ruins. Use the platform buttons for equivalent keyboard controls.','可交互等距视角依赖遗迹。可使用平台按钮完成同样的键盘操作。'))}
